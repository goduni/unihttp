name: Documentation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.10.8"
      - run: uv sync --group docs --group tests
      - run: >-
          uv run --group docs --group tests pytest
          tests/test_docs_examples.py tests/test_docs_serialization.py tests/test_docs_responses.py tests/test_docs_build.py -q
      - run: uv run --group docs python scripts/build_docs.py
        env:
          DOCS_NOINDEX: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: .build/docs
