[project]
site_name = "unihttp"
site_description = "unihttp – modern library for creating declarative API clients."
site_url = "https://unihttp.readthedocs.io/en/latest/"
repo_url = "https://github.com/goduni/unihttp"
repo_name = "goduni/unihttp"
edit_uri = "edit/master/site/"
docs_dir = "site"
site_dir = ".build/docs"
watch = ["src", "examples"]
extra_css = ["stylesheets/overview.css", "stylesheets/installation.css"]
nav = [
  { "Getting started" = [
    { "Overview" = "index.md" },
    { "Installation" = "getting-started/installation.md" },
    { "Sync quickstart" = "getting-started/quickstart.md" },
    { "Async quickstart" = "getting-started/async.md" },
  ] },
  { "User guide" = [
    "guides/index.md",
    { "Requests" = [
      { "Methods and parameters" = "guides/methods.md" },
      { "Optional fields and Omitted" = "recipes/partial-updates.md" },
      { "File uploads" = "recipes/files.md" },
    ] },
    { "Clients and middleware" = [
      { "HTTP backends" = "integrations/backends.md" },
      { "Middleware" = "guides/middleware.md" },
      { "Authentication" = "recipes/authentication.md" },
    ] },
    { "Serialization" = "guides/serialization.md" },
    { "Responses and errors" = [
      { "Response data and metadata" = "guides/responses.md" },
      { "Error handling" = "guides/errors.md" },
      { "Retries" = "recipes/retries.md" },
      { "Streaming downloads" = "guides/streaming.md" },
    ] },
  ] },
  { "API reference" = [
    "reference/index.md",
    { "Methods and binding" = "reference/methods.md" },
    { "Clients" = "reference/clients.md" },
    { "Markers and omitted values" = "reference/markers.md" },
    { "HTTP types" = "reference/http.md" },
    { "Serializers" = "reference/serializers.md" },
    { "Middleware and exceptions" = "reference/middleware.md" },
  ] },
  { "Coding agent skills" = "project/agent-skills.md" },
  { "Contributing" = "project/documentation.md" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
features = ["navigation.indexes", "navigation.path", "navigation.footer", "content.code.copy", "content.action.edit", "content.tabs.link"]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.theme.font]
text = false
code = false

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.highlight]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
dedent_subsections = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
extensions = ["scripts/docs_griffe.py:UnihttpDocsExtension"]
docstring_style = "google"
show_source = false
show_signature_annotations = true
separate_signature = true
show_root_heading = true
heading_level = 2
members_order = "source"
show_if_no_docstring = true
merge_init_into_class = true
show_signature = true

[project.plugins.redirects.redirect_maps]
"integrations/adaptix.md" = "guides/serialization.md"
"integrations/pydantic.md" = "guides/serialization.md"
"integrations/msgspec.md" = "guides/serialization.md"
